name = "04_crazy_15m_1h_stop"
description = "The crazy idea: 15-minute trigger in the direction of the 1h trend, stop beyond the 1h swing, target 2.5 times the risk."
max_hold_hours = 48
[entry]
type = "trigger"
sides = "both"
[bias]
type = "trend"
timeframe = "1h"
fast = 20
slow = 50
[stop]
type = "level"
buffer = 0.1
level = { type = "swing", timeframe = "1h", k = 3 }
[target]
type = "r"
multiple = 2.5
